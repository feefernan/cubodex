name: Deploy

# Merge na main = deploy no Cloudflare, na conta PRÓPRIA do Cubodex (não a do Hortelã).
# Segredos (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — scripts/ligar-cloudflare.sh. Sem eles, o job avisa e pula.
#   NOTION_TOKEN, MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET, MELHOR_ENVIO_TOKEN — scripts/ligar-integracoes.sh.
#   Vazios = a rota correspondente da API responde 503 e o site explica ("ainda não está ligado").

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Verificar credenciais
        id: cred
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID ausente — rode scripts/ligar-cloudflare.sh. Deploy pulado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run check
      - name: Banco das contas (D1) e migrações
        # Cria o banco na primeira vez e aplica worker/migrations antes do código novo entrar no ar.
        if: steps.cred.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          uuid() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/"uuid"\s*:\s*"([0-9a-f-]{36})"/);process.stdout.write(m?m[1]:"")})'; }
          id=$(npx cf d1 list --name cubodex-db | uuid)
          [ -n "$id" ] || id=$(npx cf d1 create --name cubodex-db | uuid)
          [ -n "$id" ] || { echo "::error::não achei nem criei o banco cubodex-db"; exit 1; }
          npx cf d1 migrations apply "$id" --dir worker/migrations
      - name: Publicar
        if: steps.cred.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          MELHOR_ENVIO_TOKEN: ${{ secrets.MELHOR_ENVIO_TOKEN }}
        run: |
          umask 077
          node -e 'const e = process.env; require("fs").writeFileSync(e.RUNNER_TEMP + "/secrets.json", JSON.stringify(Object.fromEntries(["NOTION_TOKEN", "MP_ACCESS_TOKEN", "MP_WEBHOOK_SECRET", "MELHOR_ENVIO_TOKEN"].map((k) => [k, e[k] ?? ""]))))'
          npx cf deploy --secrets-file "$RUNNER_TEMP/secrets.json" --message "${{ github.sha }}"
          rm -f "$RUNNER_TEMP/secrets.json"
