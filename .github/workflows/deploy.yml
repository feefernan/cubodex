name: Deploy

# Merge na main = deploy no Cloudflare, na conta PRÓPRIA do Cubodex (não a do Hortelã).
# Segredos necessários (Settings → Secrets and variables → Actions), cadastrados com scripts/ligar-cloudflare.sh:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Sem eles, o job avisa e pula.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Verificar credenciais
        id: cred
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID ausente — rode scripts/ligar-cloudflare.sh. Deploy pulado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run check
      - name: Publicar
        if: steps.cred.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy --message "${{ github.sha }}"
